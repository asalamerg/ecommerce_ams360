name: store

x-app: &app
    image: ${APP_IMAGE:?deploy.sh sets APP_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: 3306
        REDIS_HOST: redis
        MYSQL_ROOT_PASSWORD: ''
    volumes:
        - app_storage:/app/storage/app
    logging: &logging
        driver: json-file
        options:
            max-size: 10m
            max-file: '5'

services:
    app:
        <<: *app
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
            - '${HTTPS_PORT:-443}:443/udp'
        volumes:
            - app_storage:/app/storage/app
            - caddy_data:/data
            - caddy_config:/config

    queue:
        <<: *app
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--tries=3',
                '--max-time=3600',
                '--no-ansi',
            ]
        healthcheck:
            disable: true
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Server-side rendering for search engines and a faster first paint. Reached
    # only by the app container on the internal network; no port is published.
    # If it stops, pages fall back to rendering in the browser.
    ssr:
        <<: *app
        command: ['php', 'artisan', 'inertia:start-ssr']
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
            MYSQL_ROOT_PASSWORD: ''
            INERTIA_SSR_ENABLED: 'true'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:13714/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work', '--no-ansi']
        healthcheck:
            disable: true
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Cache, sessions, rate limits and the job queue. Reached only on the internal
    # network and still password protected. Keys with an expiry (cache, sessions)
    # are evicted first when memory runs out; queued jobs never are, and the
    # append-only file keeps them across restarts.
    redis:
        image: redis:7.4-alpine
        restart: unless-stopped
        command:
            - sh
            - -c
            - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy volatile-lru
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
        volumes:
            - redis_data:/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
                ]
            interval: 10s
            timeout: 5s
            retries: 6
        logging: *logging

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        command:
            - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-768M}
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysql -h127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e ''select 1'' "$$MYSQL_DATABASE"',
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 40s
        logging: *logging

volumes:
    app_storage:
    mysql_data:
    redis_data:
    caddy_data:
    caddy_config:
